[project]
name = "django-harvardkey-cas"
version = "3.1"
authors = [
    { name = "Colin Murtaugh", email = "cmurtaugh@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "django>=3.2",
    "django-cas-ng>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["harvardkey_cas"]

[tool.uv]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "private-registry"
url = "https://aws@huit-academic-technology-482956169056.d.codeartifact.us-east-1.amazonaws.com/pypi/uw/simple/"
publish-url = "https://aws@huit-academic-technology-482956169056.d.codeartifact.us-east-1.amazonaws.com/pypi/uw/"
check-url = "https://aws@huit-academic-technology-482956169056.d.codeartifact.us-east-1.amazonaws.com/pypi/uw/simple/"